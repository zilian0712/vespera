name: Deploy to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require a fork
        env:
          IS_FORK: ${{ github.event.repository.fork }}
        run: |
          if [ "$IS_FORK" != "true" ]; then
            echo "::error::请先 Fork 本仓库，再到自己的 Fork 中点击 Deploy to Cloudflare。"
            echo "## 请先 Fork 本仓库" >> "$GITHUB_STEP_SUMMARY"
            echo "部署只在 Fork 仓库中运行。请点击原仓库右上角 Fork，再在自己的仓库配置 Cloudflare Secrets 并运行此工作流。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::请先在自己 Fork 的 Settings → Secrets and variables → Actions 中配置 CLOUDFLARE_API_TOKEN 和 CLOUDFLARE_ACCOUNT_ID。"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:worker
      - name: Deploy Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --config wrangler.jsonc
